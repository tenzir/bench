tenzir:
  pipelines:
    # Loads all the data contained in the eve.json suricata example data
    load_suricata_stale_data:
      name: Load eve.json suricata data
      definition: |
        # Load the data from local machine and extract the suricata.alert's
        from /home/cybernovo/Documents/Programming/net-lab/ocsf/data/suricata/eve.json read suricata
          | where #schema == "suricata.alert" # Only looking at Alerts at the moment
          | import
      retry-on-error: 1 minute

    # Loads all the demo data provided by the demo node
    load_suricata_example_data:
      name: Load demo suricata data
      definition: |
        # Load demo suricata data
        from https://storage.googleapis.com/tenzir-datasets/M57/suricata.json.zst read suricata --no-infer
        | where #schema == "suricata.alert" # Only looking at Alerts at the moment
        | import
      retry-on-error: 1 minute

    # Loads the demo data stale from local storage
    load_zeek_stale_data:
      name: Load stale data for zeek
      definition: |
        # Load the zeek data from local machine 
        from /home/cybernovo/Documents/Programming/net-lab/ocsf/data/zeek/zeek-all.log.zst read zeek-tsv
          | import
      retry-on-error: 1 minute

    # Loads the zeek demo data online
    load_zeek_example_data:
      name: Load demo data for zeek
      definition: |
        # Load the zeek example data
        from https://storage.googleapis.com/tenzir-datasets/M57/zeek-all.log.zst read zeek-tsv
        | import
      retry-on-error: 1 minute