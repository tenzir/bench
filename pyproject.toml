[build-system]
requires = ["uv_build>=0.8.14,<0.11.0"]
build-backend = "uv_build"

[project]
name = "tenzir-bench"
version = "0.1.0"
description = "Benchmark harness for Tenzir pipelines."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tenzir Contributors", email = "engineering@tenzir.com" },
]
packages = [{ include = "tenzir_bench", from = "src" }]
dependencies = [
  "boto3>=1.34.0,<2",
  "click>=8.1.7,<9",
  "platformdirs>=4.2.0,<5",
  "PyGithub>=2.1.1,<3",
  "PyYAML>=6.0.1,<7",
]

[project.scripts]
tenzir-bench = "tenzir_bench.cli:main"

[project.urls]
Homepage = "https://github.com/tenzir/tenzir"
Source = "https://github.com/tenzir/bench"
Issues = "https://github.com/tenzir/bench/issues"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "ty",
]
types = [
  "boto3-stubs[full]>=1.28.39",
  "types-pyyaml>=6.0.12.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
