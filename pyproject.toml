[build-system]
requires = ["uv_build>=0.8.14,<0.10.0"]
build-backend = "uv_build"

[project]
name = "tenzir-bench"
version = "0.1.0"
description = "Benchmark harness for Tenzir pipelines."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tenzir Contributors", email = "engineering@tenzir.com" },
]
packages = [{ include = "tenzir_bench", from = "src" }]
dependencies = [
  "click>=8.1.7,<9",
  "PyYAML>=6.0.1,<7",
  "PyGithub>=2.1.1,<3",
  "boto3>=1.34.0,<2",
  "platformdirs>=4.2.0,<5",
]

[project.scripts]
bench = "tenzir_bench.cli:main"

[project.urls]
Homepage = "https://github.com/tenzir/tenzir"
Source = "https://github.com/tenzir/bench"
Issues = "https://github.com/tenzir/bench/issues"

[tool.ruff]
line-length = 100
target-version = "py311"
